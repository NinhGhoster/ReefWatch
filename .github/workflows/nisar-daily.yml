name: NISAR Daily Fetch & Process

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      feature:
        description: 'Specific feature to fetch (optional)'
        required: false
        type: string
      days:
        description: 'Lookback days'
        required: false
        default: '14'
        type: string
      product:
        description: 'Product type (gslc, gcov, both)'
        required: false
        default: 'both'
        type: choice
        options: ['gslc', 'gcov', 'both']

jobs:
  nisar-fetch-process:
    runs-on: [self-hosted, spartan]
    timeout-minutes: 180
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    defaults:
      run:
        working-directory: /data/gpfs/projects/punim1990/haninhn/ReefWatch
    steps:
      - name: Activate conda environment
        run: |
          source /apps/easybuild-2022/software/Core/Mambaforge/23.1.0-4/etc/profile.d/conda.sh
          conda activate /data/gpfs/projects/punim1990/haninhn/nisar_envs/reefwatch

      - name: Configure Earthdata credentials
        run: |
          mkdir -p ~/.netrc
          echo "machine urs.earthdata.nasa.gov login ${{ secrets.EARTHDATA_USERNAME }} password ${{ secrets.EARTHDATA_PASSWORD }}" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Fetch NISAR data
        run: |
          python3 scripts/nisar_fetch.py \
            --all \
            --days ${{ github.event.inputs.days || 14 }} \
            --product ${{ github.event.inputs.product || 'both' }} \
            --resume

      - name: Process NISAR changes
        run: |
          python3 scripts/nisar_processor.py \
            --all \
            --product ${{ github.event.inputs.product || 'both' }} \
            --method both \
            --changelog

      - name: Export MVP snapshot
        run: |
          python3 scripts/export_mvp_snapshot.py

      - name: Validate MVP snapshot
        run: |
          python3 scripts/validate_mvp_snapshot.py

      - name: Upload derived artifacts
        uses: actions/upload-artifact@v4
        with:
          name: derived-snapshot
          path: derived/
          retention-days: 30

      - name: Upload imagery artifacts (sample)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imagery-sample
          path: |
            imagery_history/*_latest.h5
            imagery_history/*_latest.png
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## NISAR Daily Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Product**: ${{ github.event.inputs.product || 'both' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Lookback**: ${{ github.event.inputs.days || 14 }} days" >> $GITHUB_STEP_SUMMARY
          if [ -f derived/overview.json ]; then
            python3 -c "
            import json
            with open('derived/overview.json') as f:
              o = json.load(f)
            print(f\"**Features**: {o['counts']['features']}\")
            print(f\"**Scenes (72h)**: {o['counts']['recentScenes72h']}\")
            print(f\"**Changes**: {o['counts']['changes']}\")
            print(f\"**Pending Review**: {o['counts']['pendingChanges']}\")
            " >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f derived/source_health.json ]; then
            python3 -c "
            import json
            with open('derived/source_health.json') as f:
              h = json.load(f)
            for src in ['nisar_gslc', 'nisar_gcov']:
              if src in h['sources']:
                s = h['sources'][src]
                print(f\"**{src.upper()}**: {s['status']} ({s['sceneCount']} total, {s['recentSceneCount72h']} recent)\")
            " >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f derived/source_health.json ]; then
            python3 -c "
            import json
            with open('derived/source_health.json') as f:
              h = json.load(f)
            for src in ['nisar_gslc', 'nisar_gcov']:
              if src in h['sources']:
                s = h['sources'][src]
                print(f\"**{src.upper()}**: {s['status']} ({s['sceneCount']} total, {s['recentSceneCount72h']} recent)\")
            " >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f derived/source_health.json ]; then
            python3 -c "
            import json
            with open('derived/source_health.json') as f:
              h = json.load(f)
            for src in ['nisar_gslc', 'nisar_gcov']:
              if src in h['sources']:
                s = h['sources'][src]
                print(f\"**{src.upper()}**: {s['status']} ({s['sceneCount']} total, {s['recentSceneCount72h']} recent)\")
            " >> $GITHUB_STEP_SUMMARY
          fi