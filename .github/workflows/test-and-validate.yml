name: Test & Validate MVP Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Run Test Suite & Validate Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pillow scipy requests
          fi

      - name: Export MVP Snapshot
        run: |
          python3 scripts/export_mvp_snapshot.py

      - name: Run Test Suite
        run: |
          python3 -m unittest discover tests -v

      - name: Validate MVP Snapshot & Secret Safety
        run: |
          python3 scripts/validate_mvp_snapshot.py

      - name: Generate HTML Dashboard
        run: |
          python3 scripts/generate_dashboard.py

      - name: Upload Derived Snapshot & Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: mvp-dashboard-and-derived
          path: |
            derived/
          retention-days: 30
